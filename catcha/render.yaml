services:
  - type: web
    name: catcha
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CATCHA_ADMIN_USER
        sync: false
      - key: CATCHA_ADMIN_PASSWORD
        sync: false
      - key: CATCHA_SESSION_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
